[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# 0.26.11 contains no certificates: its entire implementation re-exports
# parent::TLS_SERVER_ROOTS from webpki-roots 1.x. The lock now resolves 1.0.10,
# which removes the distrusted root (rustls/webpki-roots#133). The advisory's
# broad <1.0.10 range also matches this harmless compatibility crate. The bans
# below keep this exception bounded to that exact shim plus patched 1.x.
# Delete the exception and bans when SQLx stops depending on 0.26.11.
# RUSTSEC-2026-0387 is a retained timing-side-channel risk, not a false positive.
# web-push-native's latest maintained release (0.5.0) requires p256 ^0.13.2,
# whose elliptic-curve 0.13 dependency requires crypto-bigint 0.5. There is no
# compatible patched release: RustSec identifies >=0.7.6 as fixed.
# https://docs.rs/crate/web-push-native/0.5.0
# https://rustsec.org/advisories/RUSTSEC-2026-0387.html
# Keep this exception limited to the existing locked 0.5.5 via the bans below.
# Remove it and those bans when Web Push supports a stack using >=0.7.6, or
# when the affected Web Push/signing stack is replaced with a patched backend.
ignore = [
  { id = "RUSTSEC-2026-0381", reason = "Exact 0.26.11 re-export shim uses patched webpki-roots >=1.0.10; all other affected versions are denied below" },
  { id = "RUSTSEC-2026-0387", reason = "Upstream web-push-native 0.5.0 requires p256 0.13 / crypto-bigint 0.5; no compatible fixed release. Retain only locked 0.5.5 until Web Push supports >=0.7.6 or its backend is replaced; timing risk remains." },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "crypto-bigint", version = "<0.5.5" },
  { name = "crypto-bigint", version = ">0.5.5, <0.7.6" },
  { name = "webpki-roots", version = "<0.26.11" },
  { name = "webpki-roots", version = ">0.26.11, <1.0.10" },
]
# WebAuthn 0.5 still requires base64 0.21; the current HTTP stack uses 0.23.
# Permit only this exact legacy codec, keeping its advisory/license checks.
# PNG 0.18 decodes with miniz_oxide 0.8; flate2 already requires 0.9.
# Remove this exact compatibility entry when PNG adopts 0.9. Both keep their
# advisory/license/source checks; do not downgrade the existing HTTP codec.
skip = [
  { name = "base64", version = "=0.21.7" },
  { name = "miniz_oxide", version = "=0.8.9" },
]
# SQLx and ACP currently bridge independently versioned protocol ecosystems.
# Their subtrees remain covered by advisory, license, and source checks.
skip-tree = [
  { name = "sqlx" },
  { name = "agent-client-protocol" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["ssh://git@github.com/dravengarden/cardea.git"]
required-git-spec = "rev"
