[package]
name = "cowboy-provider-sdk"
version = "2.4.0"
edition = "2024"
publish = false
description = "Typed authoring and artifact contracts for Cowboy Providers"
license = "MIT"
rust-version = "1.97.1"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
