# Cowboy device configuration (`cowboy-device.toml`).
# Every setting is optional; the values below are the defaults.
# Validate edits with `cowboy config check --scope device`; see docs/configuration.md.
schema = 1

[code]
# Refuse automatic agent buffer warming when the Machine's Code runtime
# process trees reach this aggregate RSS. Shared pages can count more than once.
# This is an admission threshold, not a kernel memory limit; interactive Code
# requests remain available. Zero disables automatic warming.
# size string such as "1.5GiB", from 0B to 16TiB; applies live.
# agent_rss_budget = "2GiB"
# Refuse automatic agent buffer warming at this aggregate Code process
# count. Unknown or incomplete ownership also refuses warming; interactive
# requests remain available. Zero disables automatic warming.
# integer from 0 to 4096; applies live.
# agent_process_budget = 32
# Refuse automatic agent buffer warming when aggregate Code CPU usage over
# a fresh 250 ms observation reaches this many millicores (1000 = one core).
# This is admission control, not a scheduler quota. Zero disables warming.
# integer from 0 to 256000; applies live.
# agent_cpu_millicores = 2000

[connection]
# Reconnect when the Controller does not answer a WebSocket Ping within
# this budget, even if a local proxy still accepts writes. Applies to new probes.
# duration string such as "6h", from 5s to 10m; applies live.
# controller_probe_timeout = "45s"

[capacity]
# Maximum detached ACP sessions this Device accepts.
# An explicit --max-sessions / COWBOY_MACHINE_MAX_SESSIONS still takes precedence.
# integer from 1 to 1024; needs a restart.
# max_sessions = 8
# Keep existing sessions alive while refusing new placement.
# An explicit --draining / COWBOY_MACHINE_DRAINING still takes precedence.
# boolean (true or false); needs a restart.
# draining = false

[disk]
# When free space on the filesystem holding the Device state falls below
# this, the Controller runs an extra retention pass for this Device.
# "0B" disables the trigger.
# size string such as "1.5GiB", from 0B to 16TiB; applies live.
# low_watermark = "15GiB"

[retention]
# Remove a cached runtime artifact once no retained Plugin generation
# references it and it has not been written for this long.
# duration string such as "6h", from 1h to 365d; applies live.
# artifact_cache_unreferenced_after = "7d"

[file_buffers]
# Remote sessions keep a verified copy of each file they read and edit it
# with a hash-checked splice on the target instead of resending the file.
# false returns every file to whole-file reads and writes.
# boolean (true or false); applies live.
# enabled = true
# Larger files are read and written whole, without a buffered copy.
# size string such as "1.5GiB", from 1KiB to 4MiB; applies live.
# max_file_size = "2MiB"
# Files matching any glob are read and written whole and never copied to
# this Device. A pattern without `/` matches the file name; one with `/`
# matches the absolute target path, where `**` spans directories. Matching
# ignores ASCII case. Replacing the list drops the defaults.
# array of at most 256 glob strings (`*`, `**`, `?`), each up to 256 characters; applies live.
# excluded = [".env", ".env.*", "*.pem", "*.key", "*.p12", "*.pfx", "*.kdbx", "id_rsa*", "id_ecdsa*", "id_ed25519*", "**/.ssh/**", "**/.gnupg/**", "*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.pdf", "*.ipynb", "*.db", "*.sqlite", "*.sqlite3"]
# Each session keeps at most this many bytes of buffered copies, evicting
# the least recently used first. "0B" keeps none.
# size string such as "1.5GiB", from 0B to 1GiB; applies live.
# cache_max_bytes = "64MiB"
# A buffered copy unused for this long is deleted from this Device.
# duration string such as "6h", from 1m to 30d; applies live.
# cache_max_age = "1d"
# On the target, a temporary or request file an interrupted write left
# behind is deleted by the next write in its directory once it is this old.
# duration string such as "6h", from 10m to 7d; applies live.
# target_temp_max_age = "1h"

[browser]
# Machine browser instances that may run at once on this Device. Zero
# refuses every open while leaving installed snapshots in place.
# integer from 0 to 4; applies live.
# max_instances = 1
# Upper bound of one browser unit's MemoryMax. An open sets MemoryMax to its
# admitted budget: this, or less when the Device headroom is short, never
# below memory_reserve. It covers every page of the profile, instance, /tmp
# and /dev/shm tmpfs; the kernel OOM-kills inside the unit alone above it.
# Never below memory_high.
# size string such as "1.5GiB", from 1GiB to 6GiB; applies live.
# memory_max = "2GiB"
# Upper bound of one browser unit's MemoryHigh; the kernel throttles the unit
# above it. An open uses the lesser of this and its admitted budget less an
# eighth (at least 64 MiB). Never below memory_reserve nor above memory_max.
# size string such as "1.5GiB", from 1GiB to 6GiB; applies live.
# memory_high = "1536MiB"
# Smallest memory budget a browser open is admitted with: about the
# resident working set of Chromium, Xvnc and the window manager. An open is
# refused when the Device launch ledger cannot reserve at least this beside
# worker starts and the floor. Never above memory_high.
# size string such as "1.5GiB", from 256MiB to 6GiB; applies live.
# memory_reserve = "768MiB"
# CPUQuota of one browser unit in percent of one CPU.
# integer from 50 to 400; applies live.
# cpu_quota_percent = 200
# TasksMax of one browser unit.
# integer from 128 to 2048; applies live.
# tasks_max = 512
# A running browser without a live attachment hibernates after this grace:
# its profile is snapshotted and the unit stops.
# duration string such as "6h", from 30s to 30m; applies live.
# hibernate_after = "2m"
# Hard cap on one browser run (RuntimeMaxSec of the unit and the Machine's
# own deadline).
# duration string such as "6h", from 5m to 4h; applies live.
# max_runtime = "30m"
# Size of the profile tmpfs and of /dev/shm inside one browser instance, and
# the logical bound of a published profile snapshot.
# size string such as "1.5GiB", from 64MiB to 1GiB; applies live.
# profile_max_bytes = "256MiB"
# Size of the instance tmpfs (HOME, XDG directories, TMPDIR) of one browser.
# size string such as "1.5GiB", from 32MiB to 512MiB; applies live.
# instance_max_bytes = "128MiB"
# While a viewer is attached, the browser's profile is snapshotted (frozen,
# crash-consistent) this often in addition to every graceful stop.
# duration string such as "6h", from 1m to 1h; applies live.
# snapshot_interval = "10m"
# Device-wide budget for browser snapshot staging in flight. A snapshot that
# does not fit under it, or under disk.low_watermark, is refused, never queued.
# size string such as "1.5GiB", from 256MiB to 8GiB; applies live.
# staging_max_bytes = "1GiB"
# Largest framebuffer width a viewer may request for a browser.
# integer from 320 to 4096; applies live.
# max_width = 2560
# Largest framebuffer height a viewer may request for a browser.
# integer from 480 to 4096; applies live.
# max_height = 1600
