# Cowboy device configuration (`cowboy-device.toml`).
# Every setting is optional; the values below are the defaults.
# Validate edits with `cowboy config check --scope device`; see docs/configuration.md.
schema = 1

[capacity]
# Maximum detached ACP sessions this Device accepts.
# An explicit --max-sessions / COWBOY_MACHINE_MAX_SESSIONS still takes precedence.
# integer from 1 to 1024; needs a restart.
# max_sessions = 8
# Keep existing sessions alive while refusing new placement.
# An explicit --draining / COWBOY_MACHINE_DRAINING still takes precedence.
# boolean (true or false); needs a restart.
# draining = false

[disk]
# When free space on the filesystem holding the Device state falls below
# this, the Controller runs an extra retention pass for this Device.
# "0B" disables the trigger.
# size string such as "1.5GiB", from 0B to 16TiB; applies live.
# low_watermark = "15GiB"

[retention]
# Remove a cached runtime artifact once no retained Plugin generation
# references it and it has not been written for this long.
# duration string such as "6h", from 1h to 365d; applies live.
# artifact_cache_unreferenced_after = "7d"
