# Cowboy service configuration (`cowboy-service.toml`).
# Every setting is optional; the values below are the defaults.
# Validate edits with `cowboy config check --scope service`; see docs/configuration.md.
schema = 1

[memory]
# The Machine that hosts the memory backend. Sessions on every other Machine
# reach it over their Machine connection, with no network path or credential
# of their own. Empty: those sessions run without memory.
# array of at most 1 distinct lowercase slug identifiers; applies live.
# home_machines = []

[usage]
# Rolling admission window shared by every account of one usage Provider.
# All Service quota collectors, manual and automatic, use this durable budget.
# Passive session usage and reads of cached values do not consume it.
# duration string such as "6h", from 2m to 1h; applies live.
# provider_window = "2m"
# Maximum quota collector invocations per Provider window across all accounts.
# Starts are evenly spaced; only one collector per Provider runs at a time.
# Native CLIs own internal HTTP; this is not a model-inference request limit.
# integer from 1 to 10; applies live.
# requests_per_window = 2
# Minimum interval between quota queries for the same account, including
# failures and manual refresh. Changing Machine or login does not reset it.
# duration string such as "6h", from 5m to 1h; applies live.
# account_interval = "5m"
# Maximum exponential backoff after quota collection failures.
# Authentication failures wait this long; cached reads remain available.
# duration string such as "6h", from 1h to 1d; applies live.
# failure_backoff_max = "1h"

[accounts]
# Allow new named Claude sessions with an admitted native login.
# Does not start logins or bypass Machine, release, identity or runtime checks.
# Disabling refuses new creation; existing sessions keep their lifecycle checks.
# boolean (true or false); applies live.
# native_claude_sessions = false
# Allow explicit named Claude native logins on account-aware Machines.
# Does not enable named session creation, copy credentials, or start a login.
# Disabling refuses new logins; existing receipt recovery and cleanup remain available.
# boolean (true or false); applies live.
# native_claude_login = false
# Delay between bounded recovery pages of existing account revocation intents.
# Does not start login, probe Providers, or declare upstream logout complete.
# duration string such as "6h", from 30s to 1d; applies live.
# revocation_retry_interval = "1m"

[plugins]
# How often the Controller asks every connected Device to retire Plugin
# generations that no open, hibernated or unpurged session pins.
# duration string such as "6h", from 10m to 7d; applies live.
# generation_retention_interval = "6h"
# Plugin IDs excluded from the Service Catalog, Provider discovery and host
# activation. Also blocks new installations and login/session admission.
# Uninstall idle Machine installations separately; history and credentials are retained.
# array of at most 128 distinct lowercase slug identifiers; needs a restart.
# disabled = []
# Minimum time between extra retention passes for one Device whose
# available disk is below its declared `disk.low_watermark`.
# duration string such as "6h", from 5m to 7d; applies live.
# urgent_retention_cooldown = "1h"
# Newest releases of each Plugin the Service Catalog keeps beyond the ones a
# recoverable session pins, a Device reports installed or targets in an install
# operation, or the host policy selects. Each scheduled retention pass retires
# the other releases once they are a day old, with the artifacts only they used.
# `0` keeps every published release.
# integer from 0 to 64; applies live.
# catalog_keep_releases = 3
# Move sessions that have been exited without a worker for
# `plugins.repin_dormant_after` to their Device's installed Provider release,
# when its native session contract is unchanged, so their old generation can be
# retired. They resume on the new release when opened, like an explicit Reload.
# boolean (true or false); applies live.
# repin_dormant_sessions = false
# How long a session must stay dormant before it is re-pinned. Measured
# across Controller restarts from the first retention pass that saw it dormant.
# duration string such as "6h", from 1h to 365d; applies live.
# repin_dormant_after = "7d"
# Move every idle, non-system session to its Device's newer installed
# Provider release once it has had no event for `plugins.auto_update_idle_after`,
# through the same gate and native resume as an explicit Reload. A session
# without a worker is only re-pinned, so it opens on the new release. Sessions
# that opted in, or asked to update after their turn, update as soon as idle.
# boolean (true or false); applies live.
# auto_update_idle_sessions = false
# Idle time before the fleet policy updates a session. Keep it at or above the
# longest Provider prompt-cache lifetime so the next prompt costs nothing extra.
# duration string such as "6h", from 5m to 7d; applies live.
# auto_update_idle_after = "1h"
# Idle time after which the fleet policy stops restarting a session's worker
# for each new release. The session then adopts the installed release when it
# is next opened, so one nobody is using does not resume its native session on
# every release. Workerless sessions are still re-pinned.
# duration string such as "6h", from 1h to 30d; applies live.
# auto_update_idle_limit = "12h"

[sessions]
# When a new session targets a Device whose session slots are full, hibernate
# the longest-idle eligible session on it first instead of refusing.
# Hibernation sends no model request and the session resumes when opened.
# boolean (true or false); applies live.
# reclaim_on_capacity = false
# A session is eligible for reclaim only after this long without any event.
# A Provider prompt cache outlives the process only while unexpired and when
# the resumed request repeats the same prefix, so below the cache lifetime a
# resume can turn a cache read into a cache write.
# duration string such as "6h", from 5m to 7d; applies live.
# reclaim_min_idle = "1h"
# Hibernate idle sessions on a Device whose reported memory headroom (the
# tightest cgroup limit above its Agent workers, less their usage, plus
# droppable file cache) falls below memory_reclaim_below, longest-idle first
# and one at a time, until it is back above memory_reclaim_until.
# boolean (true or false); applies live.
# memory_reclaim = false
# Headroom below which memory reclaim starts.
# size string such as "1.5GiB", from 128MiB to 1TiB; applies live.
# memory_reclaim_below = "1GiB"
# Headroom at which memory reclaim stops; never below memory_reclaim_below.
# size string such as "1.5GiB", from 128MiB to 1TiB; applies live.
# memory_reclaim_until = "2GiB"
# Memory reclaim only hibernates sessions this long without any event. Busy,
# permission-waiting, background-working, system and cache-protected sessions
# are never chosen.
# duration string such as "6h", from 5m to 7d; applies live.
# memory_reclaim_min_idle = "15m"
