# Cowboy service configuration (`cowboy-service.toml`).
# Every setting is optional; the values below are the defaults.
# Validate edits with `cowboy config check --scope service`; see docs/configuration.md.
schema = 1

[plugins]
# How often the Controller asks every connected Device to retire Plugin
# generations that no open, hibernated or unpurged session pins.
# duration string such as "6h", from 10m to 7d; applies live.
# generation_retention_interval = "6h"
# Minimum time between extra retention passes for one Device whose
# available disk is below its declared `disk.low_watermark`.
# duration string such as "6h", from 5m to 7d; applies live.
# urgent_retention_cooldown = "1h"

[sessions]
# When a new session targets a Device whose session slots are full, hibernate
# the longest-idle eligible session on it first instead of refusing.
# Hibernation sends no model request and the session resumes when opened.
# boolean (true or false); applies live.
# reclaim_on_capacity = false
# A session is eligible for reclaim only after this long without any event.
# Keep it at or above the longest Provider prompt-cache lifetime so a
# reclaimed session's cache has already expired and resuming costs nothing
# extra.
# duration string such as "6h", from 5m to 7d; applies live.
# reclaim_min_idle = "1h"
