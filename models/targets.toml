# Evaluation targets (schema 1).
#
# A target is one (model, effort) configuration. Targets with `provider` and
# `preset` are executable Cowboy presets: their `values` must equal the signed
# `configuration_presets` entry in plugins/<provider>/provider.json, which the
# scorer checks. Targets without them are market research only and never
# become a recommendation or a routing candidate.
#
# Cost is never declared here: it comes from `axis = "cost"` observations.
# `released` (vendor release date of the model) drives the provisional window.

schema = 1

[[targets]]
id = "gpt-6.2-astra:max"
vendor = "openai"
model = "gpt-6.2-astra"
effort = "max"
released = "2026-11-17"
provider = "codex"
preset = "astra-max"
values = { model = "gpt-6.2-astra", reasoning_effort = "max" }

