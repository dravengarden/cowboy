[package]
name = "cowboy-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "The cowboy CLI, ACP bridge, product CLI, and Machine installer"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_cli"
path = "src/lib.rs"

[[bin]]
name = "cowboy"
path = "src/main.rs"
test = false

[features]
default = ["full"]
full = [
  "cowboy/full",
  "dep:agent-client-protocol",
  "dep:cardea-core",
  "dep:fs2",
  "dep:tokio-tungstenite",
]
machine-host = ["cowboy/machine-host"]
test-support = ["cowboy/test-support"]

[dependencies]
cowboy = { version = "0.1.0", path = "../..", default-features = false }
agent-client-protocol = { version = "3.6", features = ["unstable_end_turn_token_usage", "unstable_subagents"], optional = true }
anyhow = "1"
base64 = "0.22"
cardea-core = { git = "ssh://git@github.com/dravengarden/cardea.git", rev = "71f12d90bd1b3212f11530cbd0c20086317a5976", version = "=0.1.0", optional = true }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
flate2 = "1"
fs2 = { version = "0.4", optional = true }
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"] }
rpassword = "=7.5.4"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"], optional = true }
tracing = "0.1"
url = "2"
uuid = { version = "1", default-features = false, features = ["std", "v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process", "fs", "net"] }

[target.'cfg(all(not(target_env = "msvc"), not(target_family = "wasm")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
cowboy = { version = "0.1.0", path = "../..", default-features = false, features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[package.metadata.cargo-machete]
# cowboy-wire enables test fixtures.
ignored = ["cowboy-wire"]
