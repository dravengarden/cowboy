[package]
name = "cowboy-plugin-sdk"
version = "1.2.1"
edition = "2024"
license = "MIT"
description = "Generic package and release contracts for independently shipped Cowboy plugins"
repository = "https://github.com/dravengarden/cowboy"

[dependencies]
anyhow = "1"
base64 = "0.22"
cowboy-provider-sdk = { version = "=3.1.4", path = "../provider-sdk" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
