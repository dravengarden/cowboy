[package]
name = "cowboy-plugin-sdk"
version = "1.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
cowboy-provider-sdk = { version = "=3.0.0", path = "../provider-sdk" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
