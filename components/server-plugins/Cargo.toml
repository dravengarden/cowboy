[package]
name = "cowboy-server-plugins"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controller Plugin installation, uninstallation, compatibility, and lifecycle recovery"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server_plugins"
path = "src/lib.rs"

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host", "cowboy-server-auth/machine-host"]
test-support = ["cowboy/test-support", "cowboy-server-auth/test-support"]

[dependencies]
cowboy = { version = "0.1.0", path = "../.." }
cowboy-plugin-sdk = { version = "1.20.0", path = "../plugin-sdk" }
cowboy-provider-sdk = { version = "3.7.0", path = "../provider-sdk" }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
cowboy = { version = "0.1.0", path = "../..", features = ["test-support"] }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth", features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[package.metadata.cargo-machete]
ignored = ["cowboy-wire"]
