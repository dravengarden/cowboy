[package]
name = "cowboy-server-runtime"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controller runtime state, session/machine/WS handlers, managed calls, and MCP bindings"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server_runtime"
path = "src/lib.rs"

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host", "cowboy-server-accounts/machine-host", "cowboy-server-auth/machine-host", "cowboy-server-code/machine-host", "cowboy-server-code-buffers/machine-host", "cowboy-server-plugins/machine-host", "cowboy-server-telemetry/machine-host"]
test-support = ["cowboy/test-support", "cowboy-server-accounts/test-support", "cowboy-server-auth/test-support", "cowboy-server-code/test-support", "cowboy-server-code-buffers/test-support", "cowboy-server-plugins/test-support", "cowboy-server-telemetry/test-support", "dep:tempfile"]

[dependencies]
cowboy-codeact-runtime = { path = "../codeact-runtime" }
cowboy-server-accounts = { version = "0.1.0", path = "../server-accounts" }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth" }
cowboy-server-plugins = { version = "0.1.0", path = "../server-plugins" }
cowboy-server-code = { version = "0.1.0", path = "../server-code" }
cowboy-server-code-buffers = { version = "0.1.0", path = "../server-code-buffers" }
cowboy-server-telemetry = { version = "0.1.0", path = "../server-telemetry" }
cowboy = { version = "0.1.0", path = "../.." }
cardea-authorization = { git = "ssh://git@github.com/dravengarden/cardea.git", rev = "71f12d90bd1b3212f11530cbd0c20086317a5976", version = "=0.1.0" }
cardea-core = { git = "ssh://git@github.com/dravengarden/cardea.git", rev = "71f12d90bd1b3212f11530cbd0c20086317a5976", version = "=0.1.0" }
agent-client-protocol = { version = "3.6", features = ["unstable_end_turn_token_usage", "unstable_subagents"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
# SQLx already selects rustls' ring provider. Keep Reqwest provider-neutral so
# the build does not compile AWS-LC alongside ring for the same TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"] }
# GHSA-2mjx-qc3c-rqvc: older 0.23 handshakes can cross encryption boundaries.
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
uuid = { version = "1", default-features = false, features = ["std"] }
# parking_lot Mutex: non-poisoning. A panic inside a critical section drops the
# guard and frees the lock instead of poisoning it, which would otherwise make
# every other task's lock-acquire panic too — a daemon-wide cascade. Hub holds
# shared session/order/sync state behind these locks (src/core.rs), so this
# converts "no cascade as long as no critical section ever panics" (a hand-held
# invariant) into "no cascade, structurally".
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
mime_guess = "2"
rand = "0.8"
cowboy-provider-sdk = { version = "=3.7.0", path = "../provider-sdk" }
cowboy-plugin-sdk = { version = "=1.20.0", path = "../plugin-sdk" }
fs2 = "0.4"
tempfile = { version = "3", optional = true }
# `@`-picker file search: gitignore-aware walk + fuzzy ranking (the matcher
# Helix / Zed use). See src/files.rs.

[dev-dependencies]
cowboy-cli = { version = "0.1.0", path = "../cli" }
cowboy = { version = "0.1.0", path = "../..", features = ["test-support"] }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth", features = ["test-support"] }
cowboy-server-telemetry = { version = "0.1.0", path = "../server-telemetry", features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }


[package.metadata.cargo-machete]
# cowboy-wire enables test fixtures.
ignored = ["cowboy-wire"]
