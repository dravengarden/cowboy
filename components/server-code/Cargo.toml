[package]
name = "cowboy-server-code"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controller code reads, git/diff/file API, code context, and Zed adapter session boundary"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server_code"
path = "src/lib.rs"

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host", "cowboy-server-auth/machine-host", "cowboy-server-code-buffers/machine-host"]
test-support = ["cowboy/test-support", "cowboy-server-auth/test-support"]

[dependencies]
cowboy = { version = "0.1.0", path = "../.." }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth" }
cowboy-server-code-buffers = { version = "0.1.0", path = "../server-code-buffers" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
cowboy = { version = "0.1.0", path = "../..", features = ["test-support"] }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth", features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
futures = "0.3"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[package.metadata.cargo-machete]
ignored = ["cowboy-wire"]
