[package]
name = "cowboy-server-routes"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controller HTTP and WebSocket Axum route table compiled in parallel with agent_api"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server_routes"
path = "src/lib.rs"
test = false
doctest = false

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host", "cowboy-server-runtime/machine-host"]
test-support = ["cowboy/test-support", "cowboy-server-runtime/test-support"]

[dependencies]
cowboy = { version = "0.1.0", path = "../.." }
cowboy-server-accounts = { version = "0.1.0", path = "../server-accounts" }
cowboy-server-code = { version = "0.1.0", path = "../server-code" }
cowboy-server-plugins = { version = "0.1.0", path = "../server-plugins" }
cowboy-server-runtime = { version = "0.1.0", path = "../server-runtime" }
axum = { version = "0.8", features = ["ws"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
