[package]
name = "cowboy-server-telemetry"
version = "0.1.0"
edition = "2024"
publish = false
description = "Controller telemetry binding, resolution, recovery, and managed export coordinator"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server_telemetry"
path = "src/lib.rs"

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host", "cowboy-server-auth/machine-host"]
test-support = ["cowboy/test-support", "cowboy-server-auth/test-support", "dep:tempfile"]

[dependencies]
cowboy = { version = "0.1.0", path = "../.." }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
cowboy = { version = "0.1.0", path = "../..", features = ["test-support"] }
cowboy-server-auth = { version = "0.1.0", path = "../server-auth", features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[package.metadata.cargo-machete]
ignored = ["cowboy-wire"]
