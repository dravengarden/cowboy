[package]
name = "cowboy-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Cowboy Controller: HTTP API, WebSocket hub and the cowboy command"
license = "MIT"
rust-version = "1.98.1"

[lib]
name = "cowboy_server"
path = "src/lib.rs"

[[bin]]
name = "cowboy-controller"
path = "src/main.rs"

[features]
default = ["full"]
full = []
machine-host = ["cowboy/machine-host"]

[dependencies]
cowboy = { version = "0.1.0", path = "../.." }
cardea-authorization = { git = "ssh://git@github.com/dravengarden/cardea.git", rev = "71f12d90bd1b3212f11530cbd0c20086317a5976", version = "=0.1.0" }
cardea-core = { git = "ssh://git@github.com/dravengarden/cardea.git", rev = "71f12d90bd1b3212f11530cbd0c20086317a5976", version = "=0.1.0" }
agent-client-protocol = { version = "3.6", features = ["unstable_end_turn_token_usage"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# SQLx already selects rustls' ring provider. Keep Reqwest provider-neutral so
# the build does not compile AWS-LC alongside ring for the same TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"] }
# GHSA-2mjx-qc3c-rqvc: older 0.23 handshakes can cross encryption boundaries.
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "sqlite",
  "macros",
  "chrono",
  "json",
  "migrate",
  "tls-rustls",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics", "logs"] }
prost = "0.14"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
uuid = { version = "1", default-features = false, features = ["std"] }
webauthn-rs = { version = "0.5", default-features = false, features = [
  "danger-allow-state-serialisation",
] }
# parking_lot Mutex: non-poisoning. A panic inside a critical section drops the
# guard and frees the lock instead of poisoning it, which would otherwise make
# every other task's lock-acquire panic too — a daemon-wide cascade. Hub holds
# shared session/order/sync state behind these locks (src/core.rs), so this
# converts "no cascade as long as no critical section ever panics" (a hand-held
# invariant) into "no cascade, structurally".
parking_lot = "0.12"
rusqlite = { version = "0.32.1", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
mime_guess = "2"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.8"
cowboy-provider-sdk = { version = "=3.1.17", path = "../provider-sdk" }
cowboy-plugin-sdk = { version = "=1.12.4", path = "../plugin-sdk" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
fs2 = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
regex = "1"
# `@`-picker file search: gitignore-aware walk + fuzzy ranking (the matcher
# Helix / Zed use). See src/files.rs.

[target.'cfg(all(not(target_env = "msvc"), not(target_family = "wasm")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
cowboy-machine = { version = "0.1.0", path = "../machine", features = ["full", "machine-host", "test-support"] }
cowboy = { version = "0.1.0", path = "../..", features = ["test-support"] }
cowboy-wire = { version = "0.1.0", path = "../wire", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }


[package.metadata.cargo-machete]
# cowboy-wire enables test fixtures; cowboy-machine supplies the Machine side to integration tests.
ignored = ["cowboy-wire", "cowboy-machine"]
