[package]
name = "cowboy-zed-adapter"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
rust-version = "1.97.1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proto = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "aaf5f57dd36c41cf2ed49b13bcb091d52d5aef45" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
