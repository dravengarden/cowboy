[package]
name = "cowboy-browser-wireguard-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Independent experimental workspace; never linked into Cowboy releases.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wireguard-browser-server"
path = "src/server.rs"

[dependencies]
gotatun = { version = "=0.9.2", default-features = false, features = ["ring"] }
bytes = "1"
etherparse = "0.13"
zerocopy = "0.8"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
