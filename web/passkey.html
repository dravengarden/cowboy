<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#15111d" />
    <title>Cowboy Passkey</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #15111d;
        color: #f6f1ff;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #15111d;
      }
      main {
        box-sizing: border-box;
        width: min(100%, 32rem);
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem
          max(2rem, env(safe-area-inset-bottom));
      }
      .mark {
        color: #9f86ff;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.75rem 0;
        font-size: 1.65rem;
      }
      p {
        margin: 0;
        color: #b8abc9;
        line-height: 1.55;
      }
      #error {
        display: none;
        margin-top: 1.25rem;
        padding: 1rem;
        border: 1px solid #8c3943;
        border-radius: 0.8rem;
        color: #ffd7dc;
        background: #351c24;
      }
      #error[data-visible="true"] {
        display: block;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Cowboy secure verification</div>
      <h1 id="title">Preparing Passkey…</h1>
      <p id="status" role="status" aria-live="polite">
        Keep this sheet open while Cowboy prepares the system Passkey prompt.
      </p>
      <div id="error" role="alert"></div>
    </main>
    <script type="module" src="/src/auth/passkeyExternalPage.ts"></script>
  </body>
</html>
