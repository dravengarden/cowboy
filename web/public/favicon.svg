<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cowboy">
  <!-- Hat silhouette from Font Awesome Free 6 `hat-cowboy-side` (CC BY 4.0,
       https://fontawesome.com/license/free) — a 3/4 side profile. Re-skinned in
       the warm-object-on-cool-ground style atlantis uses: FA's two subpaths are
       the crown+brim-top (lit, leather gradient) and the brim's near side
       (darker, in shadow). A dark band with a gold buckle wraps the crown
       (echoing atlantis' gold), plus a sheen and a blurred cast shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d6bff"/><stop offset="1" stop-color="#6629d4"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#f0d199"/><stop offset="0.5" stop-color="#d39d54"/><stop offset="1" stop-color="#a86f33"/>
    </linearGradient>
    <linearGradient id="brimNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb8442"/><stop offset="1" stop-color="#8a5a28"/>
    </linearGradient>
    <linearGradient id="buckle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc8c"/><stop offset="1" stop-color="#c69736"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="crownClip"><path d="M152.7 135.9l-10.4 57.2c6.8-.7 13.6-1.1 20.5-1.1l10.7 0c39.4 0 77.8 12.1 110.1 34.7L562.4 421.8l35.1 24.6c24.4-6 42.5-28.1 42.5-54.4c0-75.8-94.7-126.6-134.6-144.7L474 83.9C468.2 53.8 441.8 32 411.1 32l-2.7 0c-5.6 0-11.1 .7-16.5 2.2L199.2 85.5c-23.9 6.4-42 26-46.5 50.4z"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(44.8 104) scale(0.66)">
    <!-- cast shadow -->
    <path d="M0 384c0 35.3 28.7 64 64 64l480 0L265.3 252.9c-26.9-18.8-58.9-28.9-91.8-28.9l-10.7 0c-60.6 0-116 34.2-143.1 88.4L13.5 325C4.6 342.7 0 362.3 0 382.2L0 384z" transform="translate(0 22)" fill="#350f63" opacity="0.5" filter="url(#soft)"/>
    <!-- brim near side (in shadow) -->
    <path d="M0 384c0 35.3 28.7 64 64 64l480 0L265.3 252.9c-26.9-18.8-58.9-28.9-91.8-28.9l-10.7 0c-60.6 0-116 34.2-143.1 88.4L13.5 325C4.6 342.7 0 362.3 0 382.2L0 384z" fill="url(#brimNear)"/>
    <!-- crown + brim top (lit) -->
    <path d="M152.7 135.9l-10.4 57.2c6.8-.7 13.6-1.1 20.5-1.1l10.7 0c39.4 0 77.8 12.1 110.1 34.7L562.4 421.8l35.1 24.6c24.4-6 42.5-28.1 42.5-54.4c0-75.8-94.7-126.6-134.6-144.7L474 83.9C468.2 53.8 441.8 32 411.1 32l-2.7 0c-5.6 0-11.1 .7-16.5 2.2L199.2 85.5c-23.9 6.4-42 26-46.5 50.4z" fill="url(#crown)"/>
    <!-- band + gold buckle, clipped to the crown -->
    <g clip-path="url(#crownClip)"><path d="M150 150 L470 270 L455 305 L135 185 Z" fill="#43291a"/></g>
    <rect x="250" y="196" width="46" height="40" rx="6" transform="rotate(20 273 216)" fill="url(#buckle)"/>
    <!-- crown sheen -->
    <ellipse clip-path="url(#crownClip)" cx="250" cy="120" rx="120" ry="26" fill="#ffffff" opacity="0.16" transform="rotate(-6 250 120)"/>
  </g>
</svg>
