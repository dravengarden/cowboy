<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cowboy">
  <!-- Cowboy hat: the slightly-angled silhouette (single asymmetric front pinch,
       no symmetric "M") given real leather material — a top-left light warms the
       up-left, darkens the down-right; the brim has a thickness/underside; a dark
       band + gold buckle and a blurred bottom-right cast shadow. Keeps the liked
       shape, restores the dimensional feel. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a987ff"/>
      <stop offset="0.55" stop-color="#6e56cf"/>
      <stop offset="1" stop-color="#4a1d96"/>
    </linearGradient>
    <linearGradient id="leather" x1="0.1" y1="0.04" x2="0.92" y2="1">
      <stop offset="0" stop-color="#f3d39a"/>
      <stop offset="0.5" stop-color="#cf9a52"/>
      <stop offset="1" stop-color="#83561e"/>
    </linearGradient>
    <linearGradient id="brimGrad" x1="0.16" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e7bb72"/>
      <stop offset="0.55" stop-color="#bd8542"/>
      <stop offset="1" stop-color="#855820"/>
    </linearGradient>
    <linearGradient id="buckle" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbe79a"/>
      <stop offset="1" stop-color="#bb8a2c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="crownClip">
      <path d="M 170 296 C 162 244 168 196 188 176 C 199 165 211 161 221 164 C 230 168 236 178 247 178 C 259 174 271 164 286 161 C 306 157 326 163 339 178 C 357 200 361 246 350 296 C 328 306 290 309 256 309 C 224 309 188 306 170 296 Z"/>
    </clipPath>
  </defs>

  <!-- Full-bleed square. Pre-rounded SVG + iOS squircle insets the hat
       so the PWA home icon looks smaller than the native App Icon. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="150" cy="150" rx="215" ry="215" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <g id="hat" transform="translate(256 286) scale(1.34) translate(-256 -286)">
    <!-- cast shadow, bottom-right -->
    <ellipse cx="276" cy="372" rx="202" ry="26" fill="#280c50" opacity="0.5" filter="url(#soft)"/>

    <!-- BRIM: underside thickness, then the rolled top -->
    <path d="M 42 262 C 120 296 200 300 256 300 C 312 300 392 296 470 262 C 450 282 372 332 256 332 C 140 332 62 282 42 262 Z"
          transform="translate(0 10)" fill="#6a4420"/>
    <path d="M 42 262 C 120 296 200 300 256 300 C 312 300 392 296 470 262 C 450 282 372 332 256 332 C 140 332 62 282 42 262 Z"
          fill="url(#brimGrad)"/>
    <!-- top sheen along the up-left edge -->
    <path d="M 72 260 C 140 292 206 298 256 299 C 206 296 140 292 82 301 Z" fill="#ffffff" opacity="0.13"/>

    <!-- CROWN -->
    <path d="M 170 296 C 162 244 168 196 188 176 C 199 165 211 161 221 164 C 230 168 236 178 247 178 C 259 174 271 164 286 161 C 306 157 326 163 339 178 C 357 200 361 246 350 296 C 328 306 290 309 256 309 C 224 309 188 306 170 296 Z"
          fill="url(#leather)"/>
    <!-- bottom-right body shading -->
    <path clip-path="url(#crownClip)" d="M 300 160 C 338 212 360 262 352 304 L 360 312 L 214 312 C 296 308 314 248 300 160 Z" fill="#5c3a18" opacity="0.26"/>
    <!-- top-left sheen -->
    <ellipse clip-path="url(#crownClip)" cx="206" cy="220" rx="16" ry="52" fill="#fbe7bd" opacity="0.36" transform="rotate(-12 206 220)"/>

    <!-- hatband + gold buckle -->
    <g clip-path="url(#crownClip)">
      <rect x="150" y="270" width="216" height="30" fill="#3c2516"/>
      <rect x="150" y="270" width="216" height="6" fill="#53331f"/>
    </g>
    <rect x="240" y="275" width="32" height="22" rx="4" fill="url(#buckle)"/>
    <rect x="247" y="280" width="18" height="12" rx="2" fill="#8f6620"/>
  </g>
</svg>
