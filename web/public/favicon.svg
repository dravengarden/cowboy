<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cowboy">
  <!-- Cowboy hat, bold + FLAT (Red Hat logic). Viewed front-3/4 like Red Hat's
       fedora: the crown carries a SINGLE asymmetric front pinch (one soft dent
       toward the front, the back rounding higher) — not a symmetric "M" cattleman
       crease, which reads awkward head-on. Cowboy character comes from the wide
       brim rolling up at both tips + the dent + a flat dark band. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a987ff"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4a1d96"/>
    </linearGradient>
    <clipPath id="crownClip">
      <path d="M 170 292 C 162 244 168 196 188 176 C 199 165 211 161 221 164 C 230 168 236 178 247 178 C 259 174 271 164 286 161 C 306 157 326 163 339 178 C 357 200 361 246 350 292 C 328 302 290 305 256 305 C 224 305 188 302 170 292 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <path d="M 42 262
           C 95 290 136 296 170 296
           C 162 244 168 196 188 176
           C 199 165 211 161 221 164
           C 230 168 236 178 247 178
           C 259 174 271 164 286 161
           C 306 157 326 163 339 178
           C 357 200 361 246 350 296
           C 380 296 417 290 470 262
           C 450 282 372 332 256 332
           C 140 332 62 282 42 262 Z"
        fill="#eccb7b"/>

  <g clip-path="url(#crownClip)">
    <rect x="150" y="268" width="216" height="30" fill="#43291a"/>
  </g>
</svg>
