<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cowboy">
  <rect width="512" height="512" rx="112" fill="#7c3aed"/>
  <!-- A cowboy hat — a name-derived mark in the app's violet brand, in the same
       "one solid colour + one white glyph" family as omega (Ω) and atlantis
       (trident). The crown carries the cattleman centre crease and the brim
       sweeps up at the tips; everything stays inside the maskable safe zone so
       the same art works rounded, full-bleed, and circle-masked. -->
  <g fill="#fff">
    <path d="M186 314 L183 220 C180 172 207 154 233 168 C245 174 251 185 256 187
             C261 185 267 174 279 168 C305 154 332 172 329 220 L326 314 Z"/>
    <path d="M70 300 C150 306 205 300 256 298 C307 300 362 306 442 300
             C398 358 330 374 256 374 C182 374 114 358 70 300 Z"/>
  </g>
  <!-- Hat band, punched back to the brand violet. -->
  <rect x="186" y="272" width="140" height="32" rx="4" fill="#7c3aed"/>
</svg>
