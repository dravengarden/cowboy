<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cowboy">
  <!-- Cowboy hat, 3/4 view from the top-left. Depth comes from: a single
       top-left light (warm leather gradients brighten up-left, darken down-
       right), the crown's TOP surface shown as an ellipse with a cattleman
       crease (centre ridge + two side dents), the brim drawn as a saddle whose
       back edge bows up and front edge dips toward the viewer, a thickness
       offset under the brim, and a blurred cast shadow thrown to the bottom-
       right. Dark hatband + gold buckle echo the app's purple/gold. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a987ff"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4a1d96"/>
    </linearGradient>
    <linearGradient id="leather" x1="0.12" y1="0.04" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f5dcaa"/>
      <stop offset="0.5" stop-color="#cf9a52"/>
      <stop offset="1" stop-color="#84571f"/>
    </linearGradient>
    <linearGradient id="crownTop" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fce8bf"/>
      <stop offset="1" stop-color="#d6a258"/>
    </linearGradient>
    <linearGradient id="brimTop" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ecc37d"/>
      <stop offset="0.6" stop-color="#bd8542"/>
      <stop offset="1" stop-color="#90632c"/>
    </linearGradient>
    <linearGradient id="buckle" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbe79a"/>
      <stop offset="1" stop-color="#bb8a2c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="crownClip">
      <path d="M 184 292 C 178 240 182 188 200 167 C 214 151 240 147 256 147 C 272 147 298 151 312 167 C 330 188 334 240 328 292 C 312 306 286 310 256 310 C 226 310 200 306 184 292 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- top-left ambient light on the ground -->
  <ellipse cx="150" cy="150" rx="215" ry="215" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <g id="hat">
    <!-- cast shadow, offset to the bottom-right (light is top-left) -->
    <ellipse cx="282" cy="394" rx="186" ry="27" fill="#280c50" opacity="0.55" filter="url(#soft)"/>

    <!-- BRIM: underside thickness, then the top saddle -->
    <path d="M 62 300 C 122 280 200 288 256 288 C 312 288 390 280 450 300 C 450 356 358 392 256 392 C 154 392 62 356 62 300 Z"
          transform="translate(7 13)" fill="#6a4420"/>
    <path d="M 62 300 C 122 280 200 288 256 288 C 312 288 390 280 450 300 C 450 354 358 386 256 386 C 154 386 62 354 62 300 Z"
          fill="url(#brimTop)"/>
    <!-- back-left edge sheen (faces the light) -->
    <path d="M 92 300 C 150 287 210 292 256 293 C 210 297 150 296 98 307 Z" fill="#ffffff" opacity="0.16"/>
    <!-- front lip shadow (curls toward viewer, away from light) -->
    <path d="M 96 360 C 162 380 350 380 416 360 C 356 383 156 383 96 360 Z" fill="#5c3a1b" opacity="0.32"/>

    <!-- CROWN body -->
    <path d="M 184 292 C 178 240 182 188 200 167 C 214 151 240 147 256 147 C 272 147 298 151 312 167 C 330 188 334 240 328 292 C 312 306 286 310 256 310 C 226 310 200 306 184 292 Z"
          fill="url(#leather)"/>
    <!-- bottom-right body shading -->
    <path clip-path="url(#crownClip)" d="M 296 150 C 330 205 335 262 330 306 L 340 312 L 214 312 C 286 308 304 248 296 150 Z" fill="#5c3a18" opacity="0.30"/>

    <!-- CROWN TOP (looking down onto it) -->
    <ellipse cx="256" cy="160" rx="62" ry="28" fill="url(#crownTop)"/>
    <!-- cattleman crease: a single soft groove running front-to-back, with a
         lit ridge to either side — a pinched crown, not two eye-like dents -->
    <path d="M 256 135 C 249 150 249 174 256 190 C 263 174 263 150 256 135 Z" fill="#9c6c31" opacity="0.45"/>
    <ellipse cx="238" cy="159" rx="10" ry="21" fill="#fce8bf" opacity="0.42" transform="rotate(-6 238 159)"/>
    <ellipse cx="274" cy="159" rx="10" ry="21" fill="#f0cf90" opacity="0.34" transform="rotate(6 274 159)"/>

    <!-- hatband + gold buckle -->
    <g clip-path="url(#crownClip)">
      <rect x="176" y="278" width="160" height="32" fill="#3c2516"/>
      <rect x="176" y="278" width="160" height="6" fill="#53331f"/>
    </g>
    <rect x="240" y="283" width="32" height="24" rx="4" fill="url(#buckle)"/>
    <rect x="247" y="289" width="18" height="12" rx="2" fill="#8f6620"/>

    <!-- crown sheen, top-left -->
    <ellipse clip-path="url(#crownClip)" cx="212" cy="222" rx="17" ry="58" fill="#ffffff" opacity="0.17" transform="rotate(-12 212 222)"/>
  </g>
</svg>
