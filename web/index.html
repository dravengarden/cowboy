<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 + user-scalable=no disables pinch / double-tap zoom so
         cowboy reads as a native app, not a zoomable web page. iOS Safari
         ignores this in a normal tab, but HONOURS it in the installed
         standalone PWA (apple-mobile-web-app-capable, below) — which is how
         cowboy is used. Bonus: it also kills iOS's focus-auto-zoom on inputs
         (the editor is already 16px to avoid that; this is belt-and-braces). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Per-scheme so the FIRST paint (before React's applyThemeColor runs)
         already latches the status-bar colour that matches the OS scheme — the
         app's actual background (#f7fdff light / #101014 dark), NOT the primary
         violet. After mount, theme.ts owns it (incl. a manual light/dark
         override + re-assert on resume). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7fdff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cowboy" />
    <link rel="manifest" href="/manifest.webmanifest?v=cowboy-v1736" />
    <link rel="icon" href="/cowboy-favicon-v10.ico" sizes="any" />
    <link rel="icon" href="/cowboy-favicon-v10.svg" type="image/svg+xml" sizes="any" />
    <!-- New filename: Safari caches apple-touch-icon.png by path and ignores
         query strings, so a redeploy cannot update Add to Home Screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/cowboy-app-icon-180-v10.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/cowboy-app-icon-180-v10.png" />
    <title>Cowboy</title>
    <style>
      /* Hard reset so the root flex container has a 100% canvas to work on
         no matter what the browser's default margins / DPI / dvh quirks
         do. CssBaseline alone doesn't set html/body to fill the viewport
         (only normalizes spacing), which leaves an unsightly band of
         background on some displays. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
        /* iOS Safari / WKWebView default tap wash. The native loader already
           killed this; the remote app page did not, so tapping Session
           settings left a grey highlight on the bottom chrome and on the
           sheet dismiss that mounts under the same finger. */
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        /* Keep every top-level surface on one inset contract. iPadOS normally
           publishes the system-owned status/window chrome through safe-area,
           but affected standalone WebKit builds report zero while still
           painting that chrome above the page. */
        --cowboy-system-top-clearance: env(safe-area-inset-top, 0px);
        /* The status-strip material follows the real safe area. An iPhone PWA
           (status-bar-style default) starts below the system-drawn bar and
           reports zero, so it paints no strip; only the iPad rule below has a
           floor. */
        --cowboy-mobile-status-material-height: env(safe-area-inset-top, 0px);
      }
      @media (display-mode: standalone) and (any-pointer: coarse) and (min-width: 700px) and (min-height: 700px) {
        :root {
          /* A quiet, solid-backed band keeps iPad window chrome away from
             Cowboy titles and transient controls when WebKit loses the inset.
             min-height keeps a landscape iPhone (at most 440 px tall) out.
             max() preserves a larger real safe area when the OS provides one.
             The status-strip material uses the same floor so Transcript and
             cover sheets inset with the frost instead of painting under the
             system bar. */
          --cowboy-system-top-clearance: max(env(safe-area-inset-top, 0px), 24px);
          --cowboy-mobile-status-material-height: max(env(safe-area-inset-top, 0px), 24px);
        }
      }
      /* Settings and other workbenches portal onto document.body. The App
         :has() rule cannot see those sheets, so the status frost would stay
         painted over the grabber. html:has sees every open DetentSheet. */
      html:has([data-detent-sheet='true']) [data-detent-sheet-chrome='true'] {
        opacity: 0;
        pointer-events: none;
      }
      /* Page scroll is locked (html overflow:hidden); all real scrolling lives
         inside the transcript pane. NORMAL FLOW — NOT a position:fixed body: the
         native Tauri shell resizes the WKWebView for the keyboard
         (CowboyNativeTweaks.mm — the Capacitor resize:native model), so the
         layout viewport already shrinks with no CSS lock. Dropping the old PWA
         position:fixed body removes the WebKit "editable won't repaint inside
         position:fixed" bug at the ROOT — the source of the iOS IME swallow and
         of the translateZ/composition hacks that fought the long-press paste
         menu. The PWA mobile keyboard path is retired; the shell is the delivery. */
      html {
        overflow: hidden;
      }
      body {
        overflow: hidden;
      }
      /* #root fills the body = the (natively-resized) viewport. height:100%
         (NOT 100dvh) so it always matches the body — no blank strip. */
      #root {
        height: 100%;
      }
      /* Cover DetentSheets are 100dvh of the LAYOUT viewport. iOS Safari
         pans visualViewport.offsetTop over that taller box while the
         keyboard is up, so New Session's Title scrolls off the top and
         only Cancel/Create remain. Pin covers to --vv-offset/--vv-height
         (published from visualViewport). Obsidian compact cards are
         content-height and keep their own bottom docking. */
      [data-detent-sheet="true"]:not([data-obsidian-sheet]) {
        top: var(--vv-offset, 0px) !important;
        bottom: auto !important;
        height: var(--vv-height, 100dvh) !important;
        max-height: var(--vv-height, 100dvh) !important;
      }
      /* DetentSheet paints scrim opacity inline. After dismiss the catcher
         can sit at opacity 0 until React unmounts; on iOS that still
         swallows scrolling for the rest of the session. */
      [aria-hidden="true"]:not([data-obsidian-sheet-scrim="true"])[style*="opacity: 0;"] {
        pointer-events: none !important;
      }
      /* Pre-mount app-shell splash. Painted with the document — before the SPA
         bundle parses and the /ws socket connects — so the first frame is a
         themed spinner, not a blank canvas (cowboy used to flash white for the
         100-500ms of bundle-exec + connect). React's createRoot replaces
         #root's children on mount, so it needs no teardown JS. Colours mirror
         theme.ts background.default + text.secondary (light / dark) so there's
         no flash when React takes over. Kept self-contained here (static, no
         runtime logic) rather than imported from the shared shell, so it has no
         build-time dependency on Cowboy's local app-shell component. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7fdff;
        color: #665f74;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: #101014;
          color: #a899c4;
        }
      }
      #app-splash .app-splash-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.65;
        animation: app-splash-spin 0.8s linear infinite;
      }
      #app-splash .app-splash-title {
        font-size: 14px;
        letter-spacing: 0.06em;
        opacity: 0.75;
      }
      #cowboy-recovery-retry {
        min-height: 36px;
        padding: 0 16px;
        border: 1px solid currentColor;
        border-radius: 10px;
        color: inherit;
        background: transparent;
        font: 600 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-spinner {
          animation: none;
        }
      }
      /* Boot shell (docs/offline-first-sync.md §Boot presentation): the app's
         own layout as a static skeleton, so the first frame already reads as
         Cowboy and content REPLACES placeholders instead of a spinner giving
         way to a finished screen. The same markup is rendered by React while a
         gate or the lazy surface resolves (BootSkeleton.tsx), so nothing
         flashes between the document and the app. Colours follow the app's
         real canvas through --boot-* (set below from the persisted theme). */
      :root {
        --boot-bg: #f7fdff;
        --boot-ink: #665f74;
        --boot-paper: rgba(102, 95, 116, 0.07);
        --boot-line: rgba(102, 95, 116, 0.16);
        /* Which chrome the skeleton wears. The app's own rule is
           `finePointer && hover && !touchCapable` with no width in it
           (surface/profile.ts), so these two queries approximate it in that
           order; the class the head script restores below is the app's ACTUAL
           last answer and overrides them. */
        --boot-rail: none;
        --boot-nav: flex;
      }
      @media (pointer: fine) and (hover: hover) {
        :root {
          --boot-rail: flex;
          --boot-nav: none;
        }
      }
      @media (any-pointer: coarse) {
        :root {
          --boot-rail: none;
          --boot-nav: flex;
        }
      }
      html.boot-desktop {
        --boot-rail: flex;
        --boot-nav: none;
      }
      html.boot-touch {
        --boot-rail: none;
        --boot-nav: flex;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #101014;
          --boot-ink: #a899c4;
          --boot-paper: rgba(168, 153, 196, 0.08);
          --boot-line: rgba(168, 153, 196, 0.18);
        }
      }
      /* The saved last screen is the real thing, so it REPLACES the guess
         rather than covering it. A CSS rule rather than a one-shot style
         assignment, because React re-creates the skeleton when it mounts and
         must not bring it back under the overlay. */
      body:has(#boot-snapshot) #app-splash {
        display: none;
      }
      /* Cache Storage cannot answer within the first frame, so a document
         that expects to restore a screen holds the placeholder shapes back
         rather than painting them for one beat and replacing them — that
         swap is what reads as a flash. The canvas colour still paints, and
         the script below gives up on this after BOOT_RESTORE_GRACE_MS. */
      html.boot-restoring #app-splash > * {
        visibility: hidden;
      }
      #app-splash.boot-shell {
        /* Below portalled sheets: a sign-in or Passkey prompt may have to
           appear while a first contact is still waiting. */
        z-index: auto;
        flex-direction: row;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        background: var(--boot-bg);
        color: var(--boot-ink);
      }
      .boot-rail {
        display: var(--boot-rail);
        flex-direction: column;
        gap: 10px;
        width: 300px;
        flex-shrink: 0;
        box-sizing: border-box;
        padding: 72px 12px 12px;
        border-right: 1px solid var(--boot-line);
      }
      .boot-rail .boot-bar {
        height: 36px;
        width: 100%;
        border-radius: 10px;
      }
      .boot-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding-top: var(--cowboy-system-top-clearance);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Bottom-anchored like the transcript, so the newest placeholder sits
         where the newest message will land. */
      .boot-feed {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 12px;
        padding: 12px;
      }
      .boot-card,
      .boot-bar,
      .boot-dot {
        display: block;
        flex-shrink: 0;
        background-color: var(--boot-paper);
        background-image: linear-gradient(100deg, transparent 30%, var(--boot-line) 50%, transparent 70%);
        background-size: 220% 100%;
        animation: boot-shimmer 1.6s linear infinite;
      }
      .boot-card {
        height: var(--h, 64px);
        width: var(--w, 100%);
        border-radius: 14px;
      }
      .boot-card.boot-own {
        align-self: flex-end;
      }
      .boot-bar {
        height: 12px;
        width: var(--w, 40%);
        border-radius: 6px;
      }
      .boot-dot {
        width: var(--d, 22px);
        height: var(--d, 22px);
        border-radius: 50%;
      }
      .boot-composer {
        margin: 0 12px 6px;
        min-height: 132px;
        border: 1px solid var(--boot-line);
        border-radius: 14px;
        padding: 18px 18px 14px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .boot-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .boot-nav {
        height: 56px;
        display: var(--boot-nav);
        align-items: center;
        gap: 14px;
        padding: 0 22px;
      }
      .boot-gap {
        flex: 1;
      }
      .boot-note {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translateX(-50%);
        width: min(320px, calc(100% - 48px));
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border: 1px solid var(--boot-line);
        border-radius: 14px;
        background: var(--boot-bg);
        text-align: center;
        font-size: 13px;
      }
      /* A wide window centres the column whatever the surface is. */
      @media (min-width: 900px) {
        .boot-feed {
          padding: 24px max(24px, calc((100% - 860px) / 2));
        }
        .boot-composer {
          margin: 0 max(24px, calc((100% - 860px) / 2)) 12px;
        }
      }
      @keyframes boot-shimmer {
        to {
          background-position: -220% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-card,
        .boot-bar,
        .boot-dot {
          animation: none;
        }
      }
    </style>
    <script>
      // Did the build this document belongs to actually start? This has to run
      // before the first module, because one of the failures it watches for is
      // "the entry chunk never evaluated" — nothing of ours runs after that.
      //
      // The swap writes `swapping`; this signs it in as `booting`; the app
      // removes it once it is up. A load that finds `booting` already there is
      // therefore the load after one that reached this document and never came
      // up, which is the single signature a white screen leaves behind.
      //
      // Keep the key, the phases and the TTL identical to web/src/updateAttempt.ts;
      // updateAttempt.test.ts pins the two copies together.
      (() => {
        const KEY = "cowboy:update-attempt";
        const TTL_MS = 30 * 60000;
        let raw = null;
        try {
          raw = localStorage.getItem(KEY);
        } catch {}
        if (!raw) return;
        let attempt = null;
        try {
          attempt = JSON.parse(raw);
        } catch {}
        const fresh = attempt && typeof attempt.at === "number" &&
          Date.now() - attempt.at <= TTL_MS && Date.now() >= attempt.at;
        if (!fresh) {
          try {
            localStorage.removeItem(KEY);
          } catch {}
          return;
        }
        if (attempt.phase === "swapping") {
          try {
            localStorage.setItem(KEY, JSON.stringify({ ...attempt, phase: "booting" }));
          } catch {}
          return;
        }
        if (attempt.phase === "booting") {
          window.__cowboyUpdateBootFailed = attempt;
          try {
            localStorage.removeItem(KEY);
          } catch {}
        }
      })();
    </script>
    <script>
      // The app records its real canvas colours: a manual light/dark choice or
      // an appearance palette differs from the OS scheme the CSS above assumes.
      (() => {
        // ONE place decides whether a saved screen may be shown, so the
        // synchronous hint read here and the asynchronous record read at the
        // end of the body can never disagree. They did: the hint checked only
        // the viewport and the age, so a snapshot for another session or
        // colour scheme held the skeleton back and then released it — the
        // very flash this is meant to prevent.
        window.__cowboyBootEligible = (snap) => {
          try {
            if (!snap || snap.v !== 1) return false;
            const search = new URLSearchParams(location.search);
            if (search.has("cowboy-recover") || location.pathname !== "/") return false;
            const identity = JSON.parse(localStorage.getItem("cowboy:auth-status-cache") || "null");
            const user = identity && identity.me && identity.me.user_id;
            if (typeof user !== "string") return false;
            if (identity.expiresAt !== null && identity.expiresAt <= Date.now()) return false;
            if (snap.user !== user) return false;
            // The copy is live DOM and reflows at the current size; only the
            // pinned boxes and the restored scroll offsets carry the capture's
            // geometry. An exact match would cost Desktop the feature on any
            // resize, and a browser tab whenever the URL bar came or went.
            if (Math.abs(snap.width - innerWidth) > innerWidth * 0.08) return false;
            if (Math.abs(snap.height - innerHeight) > innerHeight * 0.08) return false;
            if (Date.now() - snap.savedAt > 7 * 86400000) return false;
            // Only the screen the app is about to open: the same session (a
            // notification deep link wins, as it does in the app) on the Agent
            // page. Review reads the workspace over the network.
            const opening = search.get("session") || localStorage.getItem("cowboy:active-session") || "";
            if (opening !== (snap.sessionId || "")) return false;
            if (localStorage.getItem("cowboy:mobile-product") === "review") return false;
            const scheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            if (snap.themeMode === "system" && snap.scheme !== scheme) return false;
            return true;
          } catch {
            return false;
          }
        };
        try {
          // A saved screen is about to replace the skeleton, so do not paint
          // the placeholder shapes first. The hint carries everything the
          // decision needs except the markup and the CSS.
          if (window.__cowboyBootEligible(JSON.parse(localStorage.getItem("cowboy:boot-snapshot") || "null"))) {
            document.documentElement.classList.add("boot-restoring");
          }
          // The app's last surface answer beats any media-query guess.
          const surface = localStorage.getItem("cowboy:boot-surface");
          if (surface === "desktop") document.documentElement.classList.add("boot-desktop");
          else if (surface === "touch") document.documentElement.classList.add("boot-touch");
          const theme = JSON.parse(localStorage.getItem("cowboy:boot-theme") || "null");
          if (!theme || typeof theme !== "object") return;
          const colour = /^(#[0-9a-f]{3,8}|rgba?\([0-9.,%\s]+\))$/i;
          for (const [name, key] of [["--boot-bg", "bg"], ["--boot-ink", "ink"], ["--boot-paper", "paper"], ["--boot-line", "line"]]) {
            if (typeof theme[key] === "string" && colour.test(theme[key])) {
              document.documentElement.style.setProperty(name, theme[key]);
            }
          }
        } catch {}
      })();
    </script>
    <script>
      // Desktop boot recovery must exist BEFORE the first module executes. A
      // stale installed window can request an old hashed entry/lazy chunk after
      // an atomic web-root switch; if that first import fails, React and its
      // ErrorBoundary do not reliably exist yet. Mobile keeps its established
      // PWA recovery path — this guard is intentionally Desktop-only.
      (() => {
        const nav = navigator;
        const platform = nav.platform || "";
        const desktopHost = window.__TAURI_INTERNALS__ !== undefined ||
          (/Mac|Win|Linux/i.test(platform) && !(/Mac/i.test(platform) && nav.maxTouchPoints > 1));
        const desktopInput = matchMedia("(pointer: fine) and (hover: hover)").matches;
        if (!desktopHost || !desktopInput) return;

        const KEY = "cowboy:desktop-module-recovery";
        const PARAM = "cowboy-recover";
        const PATTERN = /(?:importing a module script failed|failed to fetch dynamically imported module|error loading dynamically imported module|chunkloaderror|loading chunk \S+ failed|unable to preload css)/i;
        let recovering = false;
        let recoveryActive = false;
        let retryTimer = 0;

        const readState = () => {
          try {
            const parsed = JSON.parse(sessionStorage.getItem(KEY) || "null");
            if (parsed && Number.isFinite(parsed.attempts) && Number.isFinite(parsed.startedAt)) {
              return parsed;
            }
          } catch {}
          return { attempts: 0, startedAt: Date.now() };
        };
        const writeState = (state) => {
          try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch {}
        };
        const showRecovery = (manual) => {
          const render = () => {
            const root = document.getElementById("root");
            if (!root) return;
            root.innerHTML = `
              <div id="app-splash" aria-label="Recovering Cowboy" role="status">
                <div class="app-splash-spinner"></div>
                <div class="app-splash-title">${manual ? "Cowboy needs a fresh reload" : "Updating Cowboy…"}</div>
                ${manual ? '<button id="cowboy-recovery-retry" type="button">Retry update</button>' : ""}
              </div>`;
            const retry = document.getElementById("cowboy-recovery-retry");
            if (retry) retry.addEventListener("click", () => void recover(true));
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", render, { once: true });
          } else render();
        };
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const recoveryFetch = async (input, init) => {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 4_000);
          try {
            return await fetch(input, { ...init, signal: controller.signal });
          } finally {
            clearTimeout(timeout);
          }
        };
        const deployedEntry = async () => {
          try {
            // `/version` only proves that the API process is reachable. During
            // an atomic web-root hand-off that is not enough: the old window
            // may still be controlled by an old worker and request a removed
            // hashed chunk. Prove that the network index AND the entry named by
            // that index are both available before navigating.
            const index = await recoveryFetch(`/?cowboy-recover-probe=${Date.now()}`, {
              cache: "no-store",
              headers: { "x-cowboy-recovery": "bundle-probe" },
            });
            if (!index.ok) return false;
            const html = await index.text();
            const tags = html.match(/<script\b[^>]*>/gi) || [];
            const moduleTag = tags.find((tag) =>
              /\btype\s*=\s*["']module["']/i.test(tag) &&
              /\bsrc\s*=\s*["'][^"']+["']/i.test(tag)
            );
            const src = moduleTag &&
              /\bsrc\s*=\s*["']([^"']+)["']/i.exec(moduleTag)?.[1];
            if (!src) return false;
            const entryUrl = new URL(src, location.origin);
            if (entryUrl.origin !== location.origin) return false;
            const entry = await recoveryFetch(entryUrl, {
              cache: "no-store",
              headers: { "x-cowboy-recovery": "entry-probe" },
            });
            return entry.ok &&
              /(?:javascript|ecmascript)/i.test(entry.headers.get("content-type") || "");
          } catch {
            return false;
          }
        };
        const scheduleRecovery = (attempts) => {
          clearTimeout(retryTimer);
          // Stay responsive for brief deploy hand-offs, then back off so an
          // offline Desktop does not spin. Foreground/network events bypass
          // this delay and retry immediately.
          const delay = Math.min(30_000, 2_000 * 2 ** Math.min(attempts, 4));
          retryTimer = setTimeout(() => void recover(), delay);
        };
        const recover = async (force = false) => {
          if (recovering) return;
          recoveryActive = true;
          recovering = true;
          const now = Date.now();
          let state = readState();
          if (force || now - state.startedAt > 60_000) {
            state = { attempts: 0, startedAt: now };
          }
          state.attempts += 1;
          writeState(state);
          showRecovery(false);

          try {
            const registration = await navigator.serviceWorker?.getRegistration();
            await registration?.update();
          } catch {}

          let ready = false;
          const deadline = Date.now() + 12_000;
          while (Date.now() < deadline) {
            if (await deployedEntry()) {
              ready = true;
              break;
            }
            await wait(500);
          }
          if (!ready) {
            recovering = false;
            // This is a degraded state, not a terminal state. Keep the manual
            // escape hatch visible while background and lifecycle retries
            // continue until the fresh index and its entry are both reachable.
            showRecovery(true);
            scheduleRecovery(state.attempts);
            return;
          }
          clearTimeout(retryTimer);
          const url = new URL(location.href);
          url.searchParams.set(PARAM, String(Date.now()));
          location.replace(url.toString());
        };
        const messageFrom = (value) => {
          if (value instanceof Error) return `${value.name} ${value.message}`;
          return String(value || "");
        };
        addEventListener("error", (event) => {
          const moduleTarget = event.target instanceof HTMLScriptElement && event.target.type === "module";
          if (moduleTarget || PATTERN.test(messageFrom(event.error) + " " + event.message)) {
            event.preventDefault();
            void recover();
          }
        }, true);
        addEventListener("unhandledrejection", (event) => {
          if (!PATTERN.test(messageFrom(event.reason))) return;
          event.preventDefault();
          void recover();
        });
        const retryActiveRecovery = () => {
          if (!recoveryActive || recovering) return;
          clearTimeout(retryTimer);
          void recover();
        };
        addEventListener("online", retryActiveRecovery);
        addEventListener("focus", retryActiveRecovery);
        addEventListener("pageshow", retryActiveRecovery);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") retryActiveRecovery();
        });
        window.__cowboyRecoverLatestBundle = recover;
        window.__cowboyDesktopBootReady = () => {
          recoveryActive = false;
          recovering = false;
          clearTimeout(retryTimer);
          try { sessionStorage.removeItem(KEY); } catch {}
          const url = new URL(location.href);
          if (url.searchParams.has(PARAM)) {
            url.searchParams.delete(PARAM);
            history.replaceState(null, "", url.toString());
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" class="boot-shell" aria-label="Loading" role="status">
        <div class="boot-rail">
          <i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i>
          <i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i>
        </div>
        <div class="boot-main">
          <div class="boot-feed">
            <i class="boot-card" style="--h: 88px"></i>
            <i class="boot-card boot-own" style="--h: 48px; --w: 62%"></i>
            <i class="boot-card" style="--h: 132px"></i>
            <i class="boot-card" style="--h: 56px"></i>
          </div>
          <div class="boot-composer">
            <i class="boot-bar" style="--w: 38%"></i>
            <div class="boot-tools">
              <i class="boot-dot"></i><i class="boot-dot"></i><i class="boot-dot"></i><i class="boot-dot"></i>
              <i class="boot-dot"></i><i class="boot-dot"></i><i class="boot-dot"></i>
            </div>
          </div>
          <div class="boot-nav">
            <i class="boot-dot"></i><i class="boot-dot" style="--d: 12px"></i>
            <i class="boot-bar" style="--w: 120px"></i><span class="boot-gap"></span>
            <i class="boot-dot"></i><i class="boot-dot"></i><i class="boot-dot"></i>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Last-screen snapshot (docs/offline-first-sync.md §Boot presentation).
      // The app saves a sanitized static copy of its resting screen; it is
      // mounted here as an inert overlay, in a closed shadow root so it shares
      // no ids, selectors or focus with the live app, until the app reports
      // its first real paint and the overlay cross-fades away. Everything is
      // optional: any mismatch leaves the boot shell above in place.
      (() => {
        // Only a safety net for Cache Storage never answering: every real
        // outcome below reveals the skeleton explicitly. It must be long
        // enough that a slow device parsing a saved screen is not interrupted
        // by it — on a real phone this timer fires on time while the parse
        // does not, which would show the placeholder for a moment and then
        // replace it.
        const BOOT_RESTORE_GRACE_MS = 2500;
        /** Ceiling on waiting for the saved screen's own web fonts. */
        const BOOT_FONT_WAIT_MS = 600;
        const root = document.documentElement;
        // Whatever happens below, the skeleton must become visible rather
        // than leave the user on a bare canvas.
        const reveal = () => root.classList.remove("boot-restoring");
        setTimeout(reveal, BOOT_RESTORE_GRACE_MS);
        const boot = { done: false, host: null };
        // Removing the host also un-hides the skeleton (the :has rule above),
        // which is what the 4s safety timeout needs if the app never painted.
        const remove = () => {
          boot.host?.remove();
          boot.host = null;
          document.getElementById("boot-snapshot-fonts")?.remove();
        };
        boot.ready = () => {
          if (boot.done) return;
          boot.done = true;
          reveal();
          const host = boot.host;
          if (!host) return;
          // Removed outright rather than cross-faded. The overlay is only let
          // go once the app has painted the same screen, and dissolving one
          // copy of that screen through another doubles every glyph for a
          // fifth of a second — which reads as a flash, not as a transition.
          remove();
        };
        window.__cowboyBoot = boot;
        // A stuck app must never hide behind a picture of itself.
        setTimeout(() => boot.ready(), 4000);
        try {
          if (!("caches" in window) || !Element.prototype.attachShadow) return reveal();
          caches.open("cowboy-boot-snapshot-v1")
            .then((cache) => cache.match("/__boot/snapshot.json"))
            .then((response) => response ? response.json() : null)
            .then((snap) => {
              // The same rule the document already applied to the hint, so a
              // held-back skeleton is always followed by the saved screen.
              if (boot.done || !window.__cowboyBootEligible(snap)) return reveal();
              const template = document.createElement("template");
              template.innerHTML = String(snap.html);
              // Defence in depth: the capture already strips these.
              for (const node of template.content.querySelectorAll("script,iframe,object,embed,link,meta,base")) node.remove();
              for (const node of template.content.querySelectorAll("*")) {
                for (const attribute of [...node.attributes]) {
                  if (/^on/i.test(attribute.name) || /^\s*javascript:/i.test(attribute.value)) node.removeAttribute(attribute.name);
                }
              }
              if (typeof snap.htmlClass === "string") {
                for (const name of snap.htmlClass.split(/\s+/)) if (/^cowboy-[\w-]+$/.test(name)) root.classList.add(name);
              }
              // Everything the picture needs, applied to the picture. Only
              // `font-size` has to go on <html>, because `rem` always resolves
              // against the document root; the rest are custom properties the
              // shadow tree inherits from its host. Writing the captured
              // viewport variables onto the live document instead would leave
              // the booting app laying out against a stale `--vv-height` until
              // it recomputed them, which is a jump the user sees.
              const hostStyle = [];
              for (const [name, value] of Array.isArray(snap.htmlStyle) ? snap.htmlStyle : []) {
                if (typeof value !== "string" || /[;{}<>]/.test(value)) continue;
                if (name === "font-size" || name === "background-color") root.style.setProperty(name, value);
                else if (/^--(cowboy|vv|kb)-[\w-]+$/.test(name)) hostStyle.push([name, value]);
              }
              if (typeof snap.fontCss === "string" && snap.fontCss) {
                // @font-face is ignored inside a shadow tree.
                const fonts = document.createElement("style");
                fonts.id = "boot-snapshot-fonts";
                fonts.textContent = snap.fontCss;
                document.head.appendChild(fonts);
              }
              const host = document.createElement("div");
              host.id = "boot-snapshot";
              host.inert = true;
              host.setAttribute("aria-hidden", "true");
              // Laid out immediately — that is what makes the browser fetch
              // the faces the saved screen uses — but not shown until they
              // arrive. Text drawn in a fallback face has different metrics
              // from the same text in the real one, so revealing it early
              // means the whole screen reflows when the app repaints it: the
              // "it jumps a moment after the content appears" report.
              // `opacity: 0` rather than `visibility: hidden`: the point of
              // mounting early is to make the browser fetch the faces, and
              // only content that is actually rendered does that.
              host.style.cssText = "position:fixed;inset:0;z-index:10000;pointer-events:none;opacity:0;background:var(--boot-bg, #f7fdff);overflow:hidden";
              for (const [name, value] of hostStyle) host.style.setProperty(name, value);
              const shadow = host.attachShadow({ mode: "closed" });
              const style = document.createElement("style");
              style.textContent = String(snap.css || "");
              const frame = document.createElement("div");
              frame.style.cssText = "position:absolute;inset:0;overflow:hidden";
              frame.appendChild(template.content);
              shadow.append(style, frame);
              document.body.appendChild(host);
              for (const node of frame.querySelectorAll("[data-boot-scroll]")) {
                const [top, left] = node.getAttribute("data-boot-scroll").split(",").map(Number);
                node.scrollTop = top || 0;
                node.scrollLeft = left || 0;
              }
              boot.host = host;
              if (boot.done) return remove();
              const show = () => {
                if (boot.host === host && !boot.done) host.style.opacity = "1";
              };
              void host.offsetHeight;
              // Ask for the reading face BY THE TEXT THIS SCREEN CONTAINS.
              // `fonts.ready` alone settles too early, and a bare family name
              // only pulls the default unicode subset — a Chinese transcript
              // would still be drawn in a fallback and reflow when the real
              // subset arrived. `check` is what decides; the load merely
              // starts it.
              const reading = (snap.htmlStyle || []).find((entry) => entry[0] === "--cowboy-reading-font");
              const spec = reading ? "1rem " + String(reading[1]).split(",")[0].trim() : "";
              const sample = String(frame.textContent || "").replace(/\s+/g, " ").slice(0, 200);
              const ready = () => {
                if (!document.fonts || !spec) return true;
                try {
                  return document.fonts.check(spec, sample);
                } catch {
                  return true;
                }
              };
              if (ready()) show();
              else {
                try {
                  document.fonts.load(spec, sample).catch(() => undefined);
                } catch {}
                const deadline = Date.now() + BOOT_FONT_WAIT_MS;
                const poll = () => {
                  if (boot.done || ready() || Date.now() > deadline) show();
                  else setTimeout(poll, 30);
                };
                poll();
              }
            })
            .catch(reveal);
        } catch {
          reveal();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
