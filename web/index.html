<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cowboy" />
    <title>cowboy</title>
    <style>
      /* Hard reset so the root flex container has a 100% canvas to work on
         no matter what the browser's default margins / DPI / dvh quirks
         do. CssBaseline alone doesn't set html/body to fill the viewport
         (only normalizes spacing), which leaves an unsightly band of
         background on some displays. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }
      /* The page itself must never scroll — all scrolling lives inside the
         transcript pane. Without this, iOS can leave the whole page scrolled
         after the keyboard closes. */
      html, body {
        overflow: hidden;
      }
      /* The root tracks the *visual* viewport height (set by main.tsx from
         window.visualViewport) so the bottom composer stays above the iOS
         software keyboard. NOTE: an earlier attempt also did position:fixed +
         translateY(visualViewport.offsetTop), but in Safari that over-lifted
         the app by a big chunk (offsetTop double-counts here) — so we track
         height ONLY and leave the root in normal flow. Falls back to 100%
         before the script runs / where visualViewport is unsupported. */
      #root {
        height: var(--app-height, 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
