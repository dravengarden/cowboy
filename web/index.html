<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0"
    />
    <!-- Rewritten at runtime by useThemeMode to the active app-bar colour;
         this static value is only the pre-hydration default. -->
    <meta name="theme-color" content="#212121" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cowboy" />
    <title>cowboy</title>
    <style>
      /* Full-height chain. CssBaseline zeroes the body margin but does not set
         heights; the app shell uses height:100% off this chain rather than
         100dvh, which under-resolves inside embedded/preview webviews and
         leaves a gap below the composer. */
      html,
      body,
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
