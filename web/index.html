<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cowboy" />
    <title>cowboy</title>
    <style>
      /* Hard reset so the root flex container has a 100% canvas to work on
         no matter what the browser's default margins / DPI / dvh quirks
         do. CssBaseline alone doesn't set html/body to fill the viewport
         (only normalizes spacing), which leaves an unsightly band of
         background on some displays. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }
      /* The page itself must never scroll — all scrolling lives inside the
         transcript pane. Without this, iOS can leave the whole page scrolled
         after the keyboard closes. */
      html, body {
        overflow: hidden;
      }
      /* Pin the app to the *visual* viewport — both its height and its
         vertical offset, set by main.tsx from window.visualViewport — so the
         bottom composer always stays above the iOS software keyboard. On iOS
         the layout viewport doesn't shrink when the keyboard opens; sometimes
         iOS resizes the visual viewport (height shrinks) and sometimes it
         scrolls it (offsetTop grows to reveal the focused input). A height-only
         fix misses the scroll case, intermittently leaving the input behind the
         keyboard. position:fixed + translateY(offsetTop) + height tracks the
         visible rectangle in either case. Falls back to a full-height static
         root before the script runs / where visualViewport is unsupported. */
      #root {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--app-height, 100%);
        transform: translateY(var(--app-offset-top, 0px));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
