<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cowboy" />
    <title>cowboy</title>
    <style>
      /* Hard reset so the root flex container has a 100% canvas to work on
         no matter what the browser's default margins / DPI / dvh quirks
         do. CssBaseline alone doesn't set html/body to fill the viewport
         (only normalizes spacing), which leaves an unsightly band of
         background on some displays. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
      }
      /* Lock the page so iOS can't scroll it; all real scrolling lives inside
         the transcript pane. The fixed body spans the layout viewport, which
         interactive-widget=resizes-content (viewport meta) shrinks when the
         keyboard opens — so #root (100dvh) follows it down with no JS. */
      html {
        overflow: hidden;
      }
      body {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
      }
      /* #root fills the fixed body, i.e. the LAYOUT viewport, which
         interactive-widget=resizes-content shrinks when the keyboard opens — so
         #root follows with no JS. height:100% (NOT 100dvh): the body is
         position:fixed inset:0 = the layout viewport, whereas 100dvh is the
         DYNAMIC viewport; in Safari (toolbar) and in a standalone home-screen
         PWA (home indicator) those differ, leaving a blank strip below #root.
         100% always matches the body. Matches the atlantis portal. */
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
