[package]
name = "cowboy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Drive coding-agent CLIs from anywhere over ACP, with one shared live progress."
license = "MIT"
rust-version = "1.95.0"

[features]
default = ["full"]
# The stable broker is built as a small, separately versioned package with
# `--no-default-features`; every other Cowboy binary uses the complete stack.
full = []

[dependencies]
agent-client-protocol = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# SQLx already selects rustls' ring provider. Keep Reqwest provider-neutral so
# the build does not compile AWS-LC alongside ring for the same TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "chrono",
  "json",
  "migrate",
  "tls-rustls",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# parking_lot Mutex: non-poisoning. A panic inside a critical section drops the
# guard and frees the lock instead of poisoning it, which would otherwise make
# every other task's lock-acquire panic too — a daemon-wide cascade. Hub holds
# shared session/order/sync state behind these locks (src/core.rs), so this
# converts "no cascade as long as no critical section ever panics" (a hand-held
# invariant) into "no cascade, structurally".
parking_lot = "0.12"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
# `@`-picker file search: gitignore-aware walk + fuzzy ranking (the matcher
# Helix / Zed use). See src/files.rs.
ignore = "0.4"
nucleo-matcher = "0.3"

[dev-dependencies]
syn = { version = "2", features = ["full"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Cowboy predates the machine-wide pedantic baseline. Keep the ordinary Clippy
# gate strict while its existing pedantic debt is reduced separately.
pedantic = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
