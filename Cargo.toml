[package]
name = "cowboy"
version = "0.1.0"
edition = "2024"
publish = false
description = "Drive coding-agent CLIs from anywhere over ACP, with one shared live progress."
license = "MIT"
rust-version = "1.97.1"

[workspace]
resolver = "3"
members = ["components/plugin-sdk", "components/provider-sdk"]
exclude = ["plugins/zed/adapter"]

[features]
default = ["full"]
# The control plane and Machine host are separate compile-time boundaries.
full = []
machine-host = []
code-adapter = []

[[bin]]
name = "cowboy-machine"
path = "src/bin/cowboy-machine.rs"
required-features = ["machine-host"]

[[bin]]
name = "cowboy-machine-install"
path = "src/bin/cowboy-machine-install.rs"
required-features = ["machine-host"]

[[bin]]
name = "cowboy-code-adapter"
path = "src/bin/cowboy-code-adapter.rs"
required-features = ["code-adapter"]

[dependencies]
agent-client-protocol = "2"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# SQLx already selects rustls' ring provider. Keep Reqwest provider-neutral so
# the build does not compile AWS-LC alongside ring for the same TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "sqlite",
  "macros",
  "chrono",
  "json",
  "migrate",
  "tls-rustls",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
password-hash = { version = "0.5", default-features = false, features = ["alloc"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["std"] }
webauthn-rs = { version = "0.5", default-features = false, features = [
  "danger-allow-state-serialisation",
] }
flate2 = "1"
tar = "0.4"
# parking_lot Mutex: non-poisoning. A panic inside a critical section drops the
# guard and frees the lock instead of poisoning it, which would otherwise make
# every other task's lock-acquire panic too — a daemon-wide cascade. Hub holds
# shared session/order/sync state behind these locks (src/core.rs), so this
# converts "no cascade as long as no critical section ever panics" (a hand-held
# invariant) into "no cascade, structurally".
parking_lot = "0.12"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
shell-words = "1"
mime_guess = "2"
web-push-native = { version = "0.5", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rpassword = "=7.5.4"
cowboy-provider-sdk = { version = "=3.1.2", path = "components/provider-sdk" }
cowboy-plugin-sdk = { version = "=1.1.2", path = "components/plugin-sdk" }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
libc = "0.2"
# `@`-picker file search: gitignore-aware walk + fuzzy ranking (the matcher
# Helix / Zed use). See src/files.rs.
ignore = "0.4"
nucleo-matcher = "0.3"

# The long-lived control plane handles bursty restore/transcript allocations.
# jemalloc returns those pages to the OS more predictably than glibc malloc;
# the controller release supplies the memory-first compile-time configuration.
[target.'cfg(all(not(target_env = "msvc"), not(target_family = "wasm")))'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
syn = { version = "2", features = ["full"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Cowboy predates the machine-wide pedantic baseline. Keep the ordinary Clippy
# gate strict while its existing pedantic debt is reduced separately.
pedantic = { level = "allow", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
