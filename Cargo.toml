[package]
name = "cowboy"
version = "0.1.0"
edition = "2021"
description = "Drive coding-agent CLIs from anywhere over ACP, with one shared live progress."

[dependencies]
agent-client-protocol = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-tungstenite = "0.29"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "chrono",
  "json",
  "migrate",
  "tls-rustls",
] }
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
# parking_lot Mutex: non-poisoning. A panic inside a critical section drops the
# guard and frees the lock instead of poisoning it, which would otherwise make
# every other task's lock-acquire panic too — a daemon-wide cascade. Hub holds
# shared session/order/sync state behind these locks (src/core.rs), so this
# converts "no cascade as long as no critical section ever panics" (a hand-held
# invariant) into "no cascade, structurally".
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
# `@`-picker file search: gitignore-aware walk + fuzzy ranking (the matcher
# Helix / Zed use). See src/files.rs.
ignore = "0.4"
nucleo-matcher = "0.3"

[dev-dependencies]
syn = { version = "2", features = ["full"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
