[package]
name = "cowboy-account-sandbox"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
rust-version = "1.98.1"
description = "Root daemon that runs each Antigravity account's processes as its own static system identity in confined transient systemd units"

# Standalone: a host-installed root binary with its own lock; it never changes
# the Cowboy workspace lock.
[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "pipe", "process", "rand", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"
# Only `raw.rs` opts back in, for the Landlock syscalls rustix has no wrapper
# for.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
