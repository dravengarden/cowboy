// GPL-3.0-or-later. Private extension of the exact pinned Zed protocol.
syntax = "proto3";
package zed.messages;

message CowboyBufferSyncVersion {
  uint32 replica_id = 1;
  uint32 timestamp = 2;
}

message CowboyBufferSync {
  uint64 project_id = 1;
  uint32 protocol = 2;
  enum Action {
    UNSPECIFIED = 0;
    PROBE = 1;
    PREPARE = 2;
    APPLY = 3;
    QUERY = 4;
    RETIRE = 5;
  }
  Action action = 3;
  bytes instance = 4;
  uint64 operation_id = 5;
  uint64 buffer_id = 6;
  repeated CowboyBufferSyncVersion version = 7;
  bytes content_sha256 = 8;
  uint32 content_bytes = 9;
}

message CowboyBufferSyncResponse {
  uint32 protocol = 1;
  bytes instance = 2;
  uint64 operation_id = 3;
  enum Phase {
    UNSPECIFIED = 0;
    SUPPORTED = 1;
    PREPARED = 2;
    PENDING = 3;
    APPLIED = 4;
    REFUSED = 5;
    RETIRED = 6;
  }
  Phase phase = 4;
  repeated CowboyBufferSyncVersion version = 5;
  bytes content_sha256 = 6;
  uint32 content_bytes = 7;
  enum Refusal {
    NONE = 0;
    CHANGED = 1;
    SOURCE = 2;
    SHARED = 3;
    BUDGET = 4;
  }
  Refusal refusal = 8;
}

// Query bytes use the exact pinned `LspQuery` codec, restricted to the five
// navigation variants, no server selection and no request identity. Empty is
// an effect-free probe. This route never falls back to upstream `LspQuery`.
message CowboyNavigation {
  uint64 project_id = 1;
  uint32 protocol = 2;
  bytes query = 3;
  // Protocol 2: exact process/peer operation, recorded before native work.
  bytes instance = 4;
  uint64 operation_id = 5;
  enum Action { EXECUTE = 0; QUERY = 1; FORGET = 2; }
  Action action = 6;
}

message CowboyNavigationResponse {
  uint32 protocol = 1;
  enum Outcome {
    UNSPECIFIED = 0;
    SUPPORTED = 1;
    COMPLETE = 2;
    REFUSED = 3;
    PENDING = 4;
    UNKNOWN = 5;
    FORGOTTEN = 6;
    CAPACITY = 7;
  }
  Outcome outcome = 2;
  // Complete pinned `LspQueryResponse`; absent on probe/refusal. Refusal is not
  // evidence of no LSP side effects, no acquired buffers, or restored state.
  bytes result = 3;
  enum Refusal {
    NONE = 0;
    BUDGET = 1;
    SOURCE = 2;
    LANGUAGE_SERVER = 3;
    TARGET = 4;
    DEADLINE = 5;
  }
  Refusal refusal = 4;
  bytes instance = 5;
  uint64 operation_id = 6;
}

// Empty instance/IDs probe the exact process. Otherwise close the complete
// sorted, unique, bounded set for the authenticated native peer in one update.
// Protocol 1 has no recovery. Protocol 2 records an exact per-peer operation;
// an unobserved reply is queried, never retried via upstream `CloseBuffer`.
message CowboyCloseBuffers {
  uint64 project_id = 1;
  uint32 protocol = 2;
  bytes instance = 3;
  repeated uint64 buffer_ids = 4;
  // Protocol 2 only: non-recycled, increasing per-peer operation identity.
  // QUERY observes the original outcome; FORGET retires only its receipt.
  uint64 operation_id = 5;
  enum Action { CLOSE = 0; QUERY = 1; FORGET = 2; }
  Action action = 6;
}

message CowboyCloseBuffersResponse {
  uint32 protocol = 1;
  bytes instance = 2;
  enum Outcome {
    UNSPECIFIED = 0;
    SUPPORTED = 1;
    CLOSED = 2;
    REFUSED = 3;
    UNKNOWN = 4;
    FORGOTTEN = 5;
    CAPACITY = 6;
  }
  Outcome outcome = 3;
  repeated uint64 buffer_ids = 4;
  uint64 operation_id = 5;
}

// Which document version each language server's current diagnostics set for a
// buffer was computed against. Every server running for the buffer is listed;
// `published` is false when no set is retained for it. The adapter compares
// `analyzed` with its own mirror and the set's stamp; no field is authority.
message CowboyAnalysisFrontier {
  uint64 project_id = 1;
  uint32 protocol = 2;
  uint64 buffer_id = 3;
}

message CowboyAnalysisServer {
  uint64 server_id = 1;
  string name = 2;
  bool published = 3;
  uint32 replica_id = 4;
  uint32 lamport_timestamp = 5;
  // The server named the document version it analyzed.
  bool versioned = 6;
  // Analyzed version when versioned; otherwise the version at publication.
  repeated CowboyBufferSyncVersion analyzed = 7;
  repeated CowboyBufferSyncVersion saved = 8;
  // New entries include disk-based (save-triggered) diagnostics.
  bool disk_based = 9;
  // The set keeps entries carried over from an earlier analysis.
  bool reused = 10;
}

message CowboyAnalysisFrontierResponse {
  uint32 protocol = 1;
  repeated CowboyAnalysisServer servers = 2;
}

// The outcome this exact server process recorded for one of the peer's own
// `OpenBufferByPath` requests, by its message ID. `UNKNOWN` means it was never
// admitted before this query on the same connection. `FORGOTTEN` means an old
// result may have existed and is never evidence of no effect. Querying has no effect.
message CowboyOpenAttempt {
  uint64 project_id = 1;
  uint32 protocol = 2;
  uint32 message_id = 3;
}

message CowboyOpenAttemptResponse {
  uint32 protocol = 1;
  enum Outcome {
    UNSPECIFIED = 0;
    UNKNOWN = 1;
    PENDING = 2;
    OPENED = 3;
    FAILED = 4;
    FORGOTTEN = 5;
  }
  Outcome outcome = 2;
  uint64 buffer_id = 3;
}

// Which existing native buffer an `OpenBufferByPath` for this path would return,
// without opening anything. `LOADING` means a load is in flight.
message CowboyOpenTarget {
  uint64 project_id = 1;
  uint32 protocol = 2;
  uint64 worktree_id = 3;
  string path = 4;
}

message CowboyOpenTargetResponse {
  uint32 protocol = 1;
  enum State {
    UNSPECIFIED = 0;
    NOT_OPEN = 1;
    OPEN = 2;
    LOADING = 3;
  }
  State state = 2;
  uint64 buffer_id = 3;
}

// Read-only result of this peer's original worktree request. A completed Add
// proves registration, while its upstream early `AddWorktreeResponse` does not.
// UNKNOWN means no admission; UNCERTAIN/FORGOTTEN never prove no effect.
message CowboyWorktreeAttempt {
  uint64 project_id = 1;
  uint32 protocol = 2;
  // Zero probes support only; it never identifies an operation.
  uint32 message_id = 3;
}

message CowboyWorktreeAttemptResponse {
  uint32 protocol = 1;
  enum Kind {
    UNSPECIFIED = 0;
    ADD = 1;
    TRUST = 2;
    RESTRICT = 3;
    REMOVE = 4;
  }
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    UNKNOWN = 1;
    PENDING = 2;
    COMPLETED = 3;
    UNCERTAIN = 4;
    FORGOTTEN = 5;
    SUPPORTED = 6;
  }
  Kind kind = 2;
  Outcome outcome = 3;
  // Original Add/Remove ID, or the sole Trust/Restrict ID (0 for other scopes).
  uint64 worktree_id = 4;
}
