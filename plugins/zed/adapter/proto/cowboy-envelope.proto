// GPL-3.0-or-later. Only the two private payload tags; ordinary messages keep
// using the exact upstream proto crate. Never combine the two payload codecs.
syntax = "proto3";
package zed.messages;
import "cowboy-buffer.proto";

message CowboyBufferSyncEnvelope {
  uint32 id = 1;
  optional uint32 responding_to = 2;
  oneof payload {
    CowboyBufferSync request = 1000;
    CowboyBufferSyncResponse response = 1001;
  }
}
