// GPL-3.0-or-later. Only private payload tags; ordinary messages keep
// using the exact upstream proto crate. Never combine the two payload codecs.
syntax = "proto3";
package zed.messages;
import "cowboy-buffer.proto";

message CowboyBufferSyncEnvelope {
  uint32 id = 1;
  optional uint32 responding_to = 2;
  oneof payload {
    CowboyBufferSync request = 1000;
    CowboyBufferSyncResponse response = 1001;
    CowboyNavigation navigation_request = 1002;
    CowboyNavigationResponse navigation_response = 1003;
    CowboyCloseBuffers close_request = 1004;
    CowboyCloseBuffersResponse close_response = 1005;
  }
}
