[package]
name = "cowboy-zed-adapter"
version = "1.13.2"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
rust-version = "1.97.1"
build = "build.rs"

# Required by the custom-build target to generate OUT_DIR/zed.messages.rs.
# The repository-wide machete scan reports it unused despite that direct use.
[package.metadata.cargo-machete]
ignored = ["prost-build"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clock = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "aaf5f57dd36c41cf2ed49b13bcb091d52d5aef45" }
getrandom = "0.4"
proto = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "aaf5f57dd36c41cf2ed49b13bcb091d52d5aef45" }
prost = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
text = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "aaf5f57dd36c41cf2ed49b13bcb091d52d5aef45" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[build-dependencies]
prost-build = "0.9"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
